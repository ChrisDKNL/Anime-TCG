name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (shared)
        # The schema guard: every exported object schema refuses unknown fields (docs/design/accounts-api.md §4.3).
        run: npm run test:run --workspace shared
      - name: Unit tests (web, with coverage)
        run: npm run test:coverage --workspace web
      - name: Unit tests (api)
        # Route tests need Postgres and run in `api-tests`, with the api coverage report.
        run: npm run test:run --workspace api
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-web
          path: web/coverage
          retention-days: 7

  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime
          POSTGRES_DB: anime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anime -d anime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Create the app role
        # What db/init/01-app-role.sh does on a compose volume; the service container has no init mount.
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U anime -d anime -c "CREATE ROLE anime_app LOGIN PASSWORD 'anime_app'"
        env:
          PGPASSWORD: anime
      - name: Unit, route and security tests with coverage
        # Fails under the 85 % statement threshold in api/vitest.config.ts.
        run: npm run test:coverage --workspace api
        env:
          DATABASE_URL: postgres://anime_app:anime_app@127.0.0.1:5432/anime
          MIGRATIONS_DATABASE_URL: postgres://anime:anime@127.0.0.1:5432/anime
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-api
          path: api/coverage
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the PR's commit range (base^..head); a depth-1 clone
          # lacks those commits and the scan errors out with "unknown revision".
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Dependency audit (high+)
        run: npm run audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker
    runs-on: ubuntu-latest
    env:
      # Must match the Caddyfile byte for byte; the smoke test asserts it.
      EXPECTED_CSP: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://s4.anilist.co; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      # Read by compose.yml: the job builds and runs anime-tcg-web:ci and anime-tcg-api:ci.
      TAG: ci
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here needs the token after checkout; keep it out of .git
          # and away from anything the image build or container could read.
          persist-credentials: false
      - name: Throwaway secrets for this run
        # Generated here so no secret-looking value is ever committed; the
        # file is read by compose only and is in .dockerignore (`**/.env*`).
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "SESSION_SECRET=$(openssl rand -base64 48)"
            echo "WEB_ORIGIN=http://127.0.0.1:8080"
          } > .env.ci
      - name: Build images and start the acceptance stack
        id: up
        # The real runtime path, not a bare `docker run`: compose.yml's
        # acceptance profile, so the hardening it declares (read-only root,
        # cap_drop ALL, no-new-privileges, pids_limit, noexec tmpfs mounts,
        # loopback publish, no published api or db port) is what the checks
        # below run against. --wait returns once every container's
        # HEALTHCHECK reports healthy (db, then api, then caddy) and fails if
        # one exits first; either way the containers are left in place for
        # the logs step. Cleanup is explicit at the end.
        run: docker compose --env-file .env.ci --profile acceptance up -d --build --wait --wait-timeout 120
      - name: Hardening is live
        run: |
          check() {
            if [ "$2" != "$3" ]; then
              echo "$1: hardening mismatch" >&2
              echo "expected: $3" >&2
              echo "actual:   $2" >&2
              exit 1
            fi
          }
          fmt='{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.PidsLimit}} {{.Config.User}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}'
          check caddy "$(docker inspect anime-tcg-acceptance --format "$fmt")" 'true 64 web [ALL] [no-new-privileges:true]'
          check api "$(docker inspect anime-tcg-api-acceptance --format "$fmt")" 'true 64 api [ALL] [no-new-privileges:true]'
          check db "$(docker inspect anime-tcg-db-acceptance --format "$fmt")" 'true 128 postgres [ALL] [no-new-privileges:true]'
          check caddy-bind "$(docker inspect anime-tcg-acceptance --format '{{index .HostConfig.PortBindings "8080/tcp" 0 "HostIp"}}')" '127.0.0.1'
          check api-ports "$(docker port anime-tcg-api-acceptance)" ''
          check db-ports "$(docker port anime-tcg-db-acceptance)" ''
      - name: Smoke test through Caddy
        run: |
          curl -fsS http://127.0.0.1:8080/healthz && echo
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>Anime TCG'
          actual="$(curl -sI http://127.0.0.1:8080/ | grep -i '^content-security-policy:' | sed 's/^[^:]*: *//' | tr -d '\r')"
          if [ "$actual" != "$EXPECTED_CSP" ]; then
            echo "Content-Security-Policy mismatch" >&2
            echo "expected: $EXPECTED_CSP" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi
          headers="$(curl -sD - -o session.json http://127.0.0.1:8080/api/session | tr -d '\r')"
          echo "$headers" | grep -qi '^cache-control: no-store$'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff$'
          echo "$headers" | grep -qi '^content-security-policy: '
          if ! echo "$headers" | grep -qi '^server:' ; then :; else echo "Server header leaked" >&2; exit 1; fi
          if ! echo "$headers" | grep -qi '^via:' ; then :; else echo "Via header leaked" >&2; exit 1; fi
          [ "$(cat session.json)" = '{"signedIn":false}' ] || { echo "unexpected /api/session body: $(cat session.json)" >&2; exit 1; }
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/session)"
          [ "$status" = "403" ] || { echo "POST without Origin answered $status, expected 403" >&2; exit 1; }

          # The routed app, a missing asset, an error Caddy answers itself and /api itself
          # (web/e2e/stack.spec.ts has the full set). fetch sets $status, $headers and body.txt.
          fetch() {
            path="$1"; shift
            status="$(curl -sS -D headers.txt -o body.txt -w '%{http_code}' "$@" "http://127.0.0.1:8080$path")"
            headers="$(tr -d '\r' < headers.txt)"
          }
          header() { echo "$headers" | sed -n "s/^$1: *//Ip"; }
          check() {
            if [ "$2" != "$3" ]; then
              echo "$path $1 mismatch" >&2
              echo "expected: $3" >&2
              echo "actual:   $2" >&2
              exit 1
            fi
          }
          fail() { echo "$path: $1" >&2; exit 1; }

          fetch /packs
          check status "$status" 200
          case "$(header content-type)" in text/html*) ;; *) fail "not text/html" ;; esac
          check CSP "$(header content-security-policy)" "$EXPECTED_CSP"
          check cache-control "$(header cache-control)" no-cache

          fetch /assets/nope.js
          check status "$status" 404
          case "$(header content-type)" in text/html*) fail "a missing asset is served as text/html" ;; esac
          case "$(header cache-control)" in *immutable*) fail "a missing asset is cached as immutable" ;; esac
          check CSP "$(header content-security-policy)" "$EXPECTED_CSP"

          fetch / -X POST
          check status "$status" 405
          check CSP "$(header content-security-policy)" "$EXPECTED_CSP"
          check nosniff "$(header x-content-type-options)" nosniff
          check Server "$(header server)" ""
          check Via "$(header via)" ""
          check body "$(cat body.txt)" ""

          fetch /api
          check status "$status" 404
          case "$(header content-type)" in application/json*) ;; *) fail "not application/json" ;; esac
          check body "$(cat body.txt)" '{"error":{"code":"not_found","message":"Route not found"}}'
      - name: The api reaches the database (internal probe)
        # The api's /healthz is not routed through Caddy on purpose; it is the
        # container's own healthcheck. Asking it from inside proves the
        # api -> db hop with an explicit assertion rather than only --wait.
        run: |
          body="$(docker compose --env-file .env.ci --profile acceptance exec -T api-acceptance wget -qO- http://127.0.0.1:3000/healthz)"
          [ "$body" = '{"status":"ok","db":"ok"}' ] || { echo "unexpected api /healthz body: $body" >&2; exit 1; }
      - name: The api sees the real client address
        # Caddy trusts X-Forwarded-For from private ranges (the host proxy or
        # tunnel) and appends its own view; the api logs the resulting
        # remoteAddress. Without `trusted_proxies` every client would appear
        # as the Docker gateway and share one rate-limit bucket.
        run: |
          curl -fsS -H 'X-Forwarded-For: 203.0.113.9' http://127.0.0.1:8080/api/session > /dev/null
          docker compose --env-file .env.ci --profile acceptance logs --no-color api-acceptance | grep -q '"remoteAddress":"203.0.113.9"'
      - name: The runtime image carries no dev modules
        run: docker compose --env-file .env.ci --profile acceptance exec -T api-acceptance test ! -e node_modules/typescript
      - name: A 502 with the api stopped keeps the site headers
        # Last, because it stops the api the steps above talk to. Caddy's
        # handle_errors path: the 502 must carry the CSP and leak no Server or Via.
        run: |
          docker compose --env-file .env.ci --profile acceptance stop api-acceptance
          [ "$(docker inspect anime-tcg-acceptance --format '{{.State.Running}}')" = true ] || { echo "caddy stopped with the api" >&2; exit 1; }
          check() {
            if [ "$2" != "$3" ]; then
              echo "/api/session $1 mismatch" >&2
              echo "expected: $3" >&2
              echo "actual:   $2" >&2
              exit 1
            fi
          }
          status="$(curl -sS -D headers.txt -o body.txt -w '%{http_code}' http://127.0.0.1:8080/api/session)"
          headers="$(tr -d '\r' < headers.txt)"
          header() { echo "$headers" | sed -n "s/^$1: *//Ip"; }
          check status "$status" 502
          check CSP "$(header content-security-policy)" "$EXPECTED_CSP"
          check Server "$(header server)" ""
          check Via "$(header via)" ""
          check body "$(cat body.txt)" ""
      - name: Container logs
        if: failure() && steps.up.outcome != 'skipped'
        run: docker compose --env-file .env.ci --profile acceptance logs --no-color
      - name: Tear down
        if: always() && steps.up.outcome != 'skipped'
        run: docker compose --env-file .env.ci --profile acceptance down --volumes --remove-orphans
