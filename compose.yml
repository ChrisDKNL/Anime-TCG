# Three services (caddy, api, db) under one profile each for acceptance and
# production, plus a loopback-only Postgres for `dev` and `test`. Nothing
# starts without a profile; that is deliberate so a bare `docker compose up`
# cannot pick one for you.
#
#   docker compose --env-file .env.acceptance.local --profile acceptance up -d --build
#   docker compose --env-file .env.production.local --profile production up -d
#   docker compose --profile dev up -d       # just Postgres on 127.0.0.1:5432 for `npm run dev`
#   docker compose --profile test up -d      # the same, for `npm run test:routes -w api`
#
# Variables come from the shell or from a gitignored env file passed with
# `--env-file` (`.env.example` lists every one). Required by acceptance and
# production: POSTGRES_PASSWORD, APP_DB_PASSWORD, SESSION_SECRET, WEB_ORIGIN. Optional: TAG,
# ACCEPTANCE_PORT, PRODUCTION_PORT, LOG_LEVEL, DEV_DB_PORT, INVITE_CODES (registration
# is closed without it), ACCOUNT_CAP. Env files are read by compose only;
# `.dockerignore` keeps them out of every build context.

x-hardened: &hardened
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 64
  # Bounded logs: a chatty or attacked container cannot fill the NAS disk.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-caddy: &caddy
  <<: *hardened
  image: anime-tcg-web:${TAG:-local}
  build: .
  # Serves web/dist and proxies /api/* to the `api` alias. Caddy's own state
  # dirs get a throwaway tmpfs so the root filesystem can stay read-only; the
  # mounts rely on Docker's default 1777 mode so the non-root user can write.
  tmpfs:
    - /data:noexec,nosuid,size=16m
    - /config:noexec,nosuid,size=16m
  mem_limit: 128m

x-api: &api
  <<: *hardened
  image: anime-tcg-api:${TAG:-local}
  build:
    context: .
    dockerfile: api/Dockerfile
  # No published port: only Caddy, on the same network, can reach it.
  mem_limit: 256m
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
    # Requests run as `anime_app` (rows only); migrations run as the owner `anime` over one connection at start-up.
    DATABASE_URL: postgres://anime_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in the env file}@db:5432/anime
    MIGRATIONS_DATABASE_URL: postgres://anime:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@db:5432/anime
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the env file to 32+ random bytes}
    # The browser's Origin on state-changing requests must equal this exactly.
    WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN to the public origin, e.g. https://anime.example.com}
    API_ORIGIN: ${WEB_ORIGIN}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Registration: comma-separated invite codes (empty closes it) and how many accounts may exist.
    INVITE_CODES: ${INVITE_CODES:-}
    ACCOUNT_CAP: ${ACCOUNT_CAP:-10}

x-db: &db
  <<: *hardened
  # Pinned to the multi-arch index digest; Dependabot (docker) proposes bumps.
  image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
  # Running as the image's `postgres` user from the start means the entrypoint
  # never needs root or the capabilities we drop; the data volume is created
  # with that owner from the image.
  user: postgres
  tmpfs:
    - /var/run/postgresql:nosuid,size=16m
    - /tmp:noexec,nosuid,size=64m
  shm_size: 128m
  mem_limit: 256m
  pids_limit: 128
  # Each service also mounts ./db/init read-only at /docker-entrypoint-initdb.d: on an empty volume the
  # entrypoint runs 01-app-role.sh, which creates the `anime_app` role from APP_DB_PASSWORD (an existing
  # volume: docs/04-deployment.md). The role's grants come from the api's migrations.
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U anime -d anime"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  db-acceptance:
    <<: *db
    profiles: [acceptance]
    container_name: anime-tcg-db-acceptance
    restart: unless-stopped
    environment:
      POSTGRES_USER: anime
      POSTGRES_DB: anime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in the env file}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-acceptance:/var/lib/postgresql/data
    networks:
      acceptance-back:
        aliases: [db]

  api-acceptance:
    <<: *api
    profiles: [acceptance]
    container_name: anime-tcg-api-acceptance
    restart: unless-stopped
    depends_on:
      db-acceptance:
        condition: service_healthy
    networks:
      acceptance-front:
        aliases: [api]
      acceptance-back: {}

  caddy-acceptance:
    <<: *caddy
    profiles: [acceptance]
    container_name: anime-tcg-acceptance
    restart: unless-stopped
    depends_on:
      api-acceptance:
        condition: service_healthy
    networks: [acceptance-front]
    # Loopback only: acceptance exists for the owner's own checks on the host
    # and must be unreachable from the LAN and the internet.
    ports:
      - "127.0.0.1:${ACCEPTANCE_PORT:-8080}:8080"

  db-production:
    <<: *db
    profiles: [production]
    container_name: anime-tcg-db-production
    restart: unless-stopped
    environment:
      POSTGRES_USER: anime
      POSTGRES_DB: anime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in the env file}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-production:/var/lib/postgresql/data
    networks:
      production-back:
        aliases: [db]

  api-production:
    <<: *api
    profiles: [production]
    container_name: anime-tcg-api-production
    restart: unless-stopped
    depends_on:
      db-production:
        condition: service_healthy
    networks:
      production-front:
        aliases: [api]
      production-back: {}

  caddy-production:
    <<: *caddy
    profiles: [production]
    container_name: anime-tcg-production
    restart: unless-stopped
    depends_on:
      api-production:
        condition: service_healthy
    networks: [production-front]
    # Loopback only, with no variable to widen it: production is reached
    # through a reverse proxy or Cloudflare Tunnel on the same host. Docker's
    # published ports bypass ufw/firewalld unless the DOCKER-USER chain is
    # configured, so "the host firewall will cover it" is not a safe default.
    # A containerised proxy should join the `production-front` network only
    # and address `caddy-production:8080` by name instead (docs/04-deployment.md).
    ports:
      - "127.0.0.1:${PRODUCTION_PORT:-8081}:8080"

  # Postgres alone, on loopback, for `npm run dev` and the api route tests.
  # Throwaway credentials on purpose: it is reachable from this host only and
  # holds nothing worth protecting.
  db:
    <<: *db
    profiles: [dev, test]
    container_name: anime-tcg-db-local
    environment:
      POSTGRES_USER: anime
      POSTGRES_DB: anime
      POSTGRES_PASSWORD: anime
      APP_DB_PASSWORD: anime_app
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-local:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"

volumes:
  db-acceptance:
  db-production:
  db-local:

# Two networks per profile: `front` carries caddy -> api, `back` carries
# api -> db and is internal, so the database has no route out of the host and
# nothing but the api can reach it. A proxy container joins `front` only.
#
# Every subnet is pinned. Left to Docker, a new network takes the next free
# block of the daemon's default pool, and on 2026-10-28 that pool was exhausted
# on the owner's host: `acceptance-front` landed on 192.168.0.0/20, which
# covers the home LAN, and every container on the host lost the LAN until the
# network was removed. 172.16.0.0/16 is reserved for this project; it must stay
# outside the LAN, the VPN and Docker Desktop's own ranges on the host that runs
# the stack (docs/04-deployment.md). Compose never changes the subnet of an
# existing network: `down` the profile once after this change.
networks:
  # The implicit network of the `dev`/`test` database.
  default:
    ipam:
      config:
        - subnet: 172.16.30.0/24
  acceptance-front:
    ipam:
      config:
        - subnet: 172.16.10.0/24
  acceptance-back:
    internal: true
    ipam:
      config:
        - subnet: 172.16.11.0/24
  production-front:
    ipam:
      config:
        - subnet: 172.16.20.0/24
  production-back:
    internal: true
    ipam:
      config:
        - subnet: 172.16.21.0/24
